name: ci

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: CI on python${{ matrix.python }} via ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-26.04
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system deps
        run: sudo apt-get -y install libvirt-dev
      - name: Install tox
        run: pip install tox
      - name: Run unit tests
        run: tox -e py3
